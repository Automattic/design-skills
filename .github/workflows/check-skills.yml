name: Check public skills

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate skills and metadata
        run: python scripts/validate-skills.py
      - name: Build individual skill archives
        run: python scripts/package-skills.py
      - name: Save archives for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skill-downloads
          path: dist/*.zip
          if-no-files-found: error
