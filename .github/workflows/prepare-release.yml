name: Prepare skill release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v2.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate release version and files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/validate-skills.py --tag "$RELEASE_TAG"
      - name: Build skill archives
        run: python scripts/package-skills.py
      - name: Attach archives to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != true ]; then
              echo "This release is already published. Prepare a new version."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
